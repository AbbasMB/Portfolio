name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.99.0
      GO_VERSION: 1.26.1
      HUGO_VERSION: 0.160.0
      NODE_VERSION: 24.14.1
      TZ: Europe/Oslo
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      - name: Install Node.js dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
      - name: Configure Git
        run: |
          git config core.quotepath false
      - name: Generate portfolio knowledge file
        run: |
          mkdir -p static/knowledge

          cat > static/knowledge/portfolio-knowledge.txt <<'EOF'
# Abbas Portfolio Knowledge

This file is automatically generated from the portfolio repository.

Generated from markdown files inside the content folder.
EOF

          cat > /tmp/process_md.pl <<'PERL'
#!/usr/bin/env perl
use strict;
use warnings;
use utf8;

foreach my $file (@ARGV) {
  local $/ = undef;
  open my $fh, '<:encoding(UTF-8)', $file or next;
  my $text = <$fh>;
  close $fh;

  my ($fm, $body);
  if ($text =~ /\A---\s*(.*?)\s*---\s*(.*)\z/s) {
    $fm = $1; $body = $2;
  } else {
    $fm = ''; $body = $text;
  }

  print "\n---\nSource file: $file\n---\n";

  for my $k (qw(title summary date tags externalUrl external_url)) {
    if ($fm =~ /(?:^|\n)\Q$k\E\s*:\s*(.+?)(?:\n|$)/i) {
      my $v = $1; $v =~ s/^\s+|\s+$//g;
      $v =~ s/^\"|\"$//g;
      print ucfirst($k) . ": $v\n" if $v ne '';
    }
  }

  # remove <style>...</style> blocks
  $body =~ s/<style\b[^>]*>.*?<\/style>//gis;
  # remove HTML comments
  $body =~ s/<!--.*?-->//gs;
  # remove fenced code blocks ```...```
  $body =~ s/```[\s\S]*?```//g;
  # strip remaining HTML tags
  $body =~ s/<[^>]+>//g;
  # collapse multiple blank lines
  $body =~ s/\n{3,}/\n\n/g;
  $body =~ s/^\s+|\s+$//g;

  print "$body\n" if $body ne '';
}
PERL

          chmod +x /tmp/process_md.pl || true

          find content -type f -name "*.md" | sort | while IFS= read -r file; do
            /tmp/process_md.pl "$file" >> static/knowledge/portfolio-knowledge.txt || true
          done
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-
      - name: Build the site
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Cache save
        id: cache-save
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
