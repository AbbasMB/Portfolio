name: Build Portfolio Knowledge

on:
  push:
    branches:
      - main
    paths:
      - content/**/*.md
      - static/**
      - assets/**
      - layouts/**
      - hugo.yaml
      - .github/workflows/update-dify-knowledge.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-knowledge
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-knowledge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate portfolio knowledge file
        run: |
          mkdir -p static/knowledge

          {
            echo "# Abbas Portfolio Knowledge"
            echo
            echo "This file is automatically generated from the portfolio repository."
            echo "Dify should use this file as the knowledge source."
            echo
            echo "Generated from markdown files inside the content folder."
            echo

            find content -type f -name "*.md" | sort | while IFS= read -r file; do
              echo
              echo "---"
              echo "Source file: ${file}"
              echo "---"
              echo
              cat "$file"
              echo
            done
          } > static/knowledge/portfolio-knowledge.txt

      - name: Commit generated knowledge file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update generated portfolio knowledge"
          file_pattern: static/knowledge/portfolio-knowledge.txt
